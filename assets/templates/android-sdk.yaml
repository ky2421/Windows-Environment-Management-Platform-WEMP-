# 环境模板：Android SDK

id: android-sdk
name: Android SDK 开发环境
description: 安卓 APP 开发：Android Studio（含 SDK、模拟器）+ JDK
version: "1.0"
minWindowsVersion: "10.0.19045"

tools:
  - name: androidstudio
    versionManager: direct
    optional: false
  - name: jdk
    version: "17"
    versionManager: direct
    optional: true

environmentVariables:
  - name: ANDROID_HOME
    value: "%LOCALAPPDATA%\\Android\\Sdk"
    scope: user
    overwrite: false

config:
  files: []

validation:
  commands:
    - command: "winget list --id Google.AndroidStudio"
      expected: "Google.AndroidStudio"

prerequisites:
  - tool: git
    minVersion: "2.0"
