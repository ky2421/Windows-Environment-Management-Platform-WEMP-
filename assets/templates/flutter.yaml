# 环境模板：Flutter 跨端开发

id: flutter
name: Flutter SDK
description: 跨端 APP 开发（Android + iOS + 桌面）：Flutter SDK + Dart。⚠ 下载源为 GitHub，需加速器
deployWarning: "下载源为 GitHub，可能需要加速器"
version: "1.0"
minWindowsVersion: "10.0.19045"

tools:
  - name: flutter
    versionManager: direct
    optional: true
  - name: dart
    versionManager: direct
    optional: true

environmentVariables:
  - name: FLUTTER_HOME
    value: "{{flutter.installDir}}"
    scope: user
    overwrite: false

config:
  files: []

validation:
  commands:
    - command: "flutter --version"
      expected: "Flutter .*"

prerequisites:
  - tool: git
    minVersion: "2.0"
