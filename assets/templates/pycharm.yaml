# 环境模板：PyCharm

id: pycharm
name: PyCharm
description: JetBrains Python 集成开发环境（Community 版）
version: "1.0"
minWindowsVersion: "10.0.19045"

tools:
  - name: pycharm
    versionManager: direct
    optional: false

environmentVariables: []

config:
  files: []

validation:
  commands:
    - command: "winget list --id JetBrains.PyCharm.Community"
      expected: "JetBrains\\.PyCharm"

prerequisites: []
