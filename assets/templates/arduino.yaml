# 环境模板：Arduino 开发

id: arduino
name: Arduino 开发环境
description: 嵌入式开发：Arduino IDE（支持 Arduino 各系列开发板）
version: "1.0"
minWindowsVersion: "10.0.19045"

tools:
  - name: arduino
    versionManager: direct
    optional: false

environmentVariables: []

config:
  files: []

validation:
  commands:
    - command: "winget list --id Arduino.IDE"
      expected: "Arduino.IDE"

prerequisites: []
