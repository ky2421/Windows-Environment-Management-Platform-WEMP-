# 环境模板：Android Studio

id: androidstudio
name: Android Studio
description: Google 安卓应用开发 IDE（含 SDK 管理器、模拟器）
version: "1.0"
minWindowsVersion: "10.0.19045"

tools:
  - name: androidstudio
    versionManager: direct
    optional: false

environmentVariables: []

config:
  files: []

validation:
